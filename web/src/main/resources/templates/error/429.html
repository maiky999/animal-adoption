<!DOCTYPE html>
<!-- Shown by Spring Boot when RateLimitFilter rejects a request (HTTP 429 Too Many Requests) -->
<html lang="pl" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::main})}">
<body>
<main class="max-w-md mx-auto px-4 py-16 w-full flex-grow">
  <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 text-center">
    <i class="ph-fill ph-hourglass-medium text-5xl text-primary mb-4"></i>
    <h2 class="text-2xl font-bold text-gray-800">[[#{error.tooManyRequests.title}]]</h2>
    <p class="text-gray-500 mt-3">[[#{error.tooManyRequests.text}]]</p>
    <a th:href="@{/}" class="inline-block mt-6 bg-primary hover:bg-primaryHover text-white font-bold py-3 px-6 rounded-xl shadow-md transition">
      [[#{error.tooManyRequests.home}]]
    </a>
  </div>
</main>
</body>
</html>
