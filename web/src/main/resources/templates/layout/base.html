<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title}">Łapka - Znajdź swojego pupila</title>
    <!-- Tailwind CSS (via CDN for the dev environment) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Phosphor icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F27D42',
                        primaryHover: '#D9652A',
                        background: '#FFF8F3',
                        surface: '#FFFFFF',
                        textMain: '#4A3F35',
                        accent: '#FDECE4'
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(242, 125, 66, 0.15)',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');

        /* SMOOTH SCROLLING (for the Floatbar) */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.textMain');
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: theme('colors.background'); }
        ::-webkit-scrollbar-thumb { background: #FDECE4; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #F27D42; }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased relative selection:bg-primary selection:text-white">

<div th:replace="~{layout/navbar :: navbar}"></div>

<div th:if="${param.logout}" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 w-full fade-in z-40 relative">
    <div class="bg-green-50 text-green-700 p-4 rounded-2xl text-sm border border-green-200 flex items-center shadow-soft">
        <i class="ph-fill ph-check-circle text-2xl mr-3 text-green-500"></i>
        <span class="font-bold text-base">[[#{layout.logout.success}]]</span>
    </div>
</div>

<!-- Result of a moderation action (removing a listing, blocking an account) - shown on whatever page the moderator returns to -->
<div th:if="${moderationMessage != null or moderationError != null}" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 w-full fade-in z-40 relative">
    <div th:if="${moderationMessage}" class="bg-green-50 text-green-700 p-4 rounded-2xl text-sm border border-green-200 flex items-center shadow-soft">
        <i class="ph-fill ph-shield-check text-2xl mr-3 text-green-500"></i>
        <span class="font-bold" th:text="#{${moderationMessage}}"></span>
    </div>
    <div th:if="${moderationError}" class="bg-red-50 text-red-700 p-4 rounded-2xl text-sm border border-red-200 flex items-center shadow-soft">
        <i class="ph-fill ph-warning-circle text-2xl mr-3 text-red-500"></i>
        <span class="font-bold" th:text="#{${moderationError}}"></span>
    </div>
</div>

<main class="flex-grow flex flex-col w-full relative z-10" th:replace="${content}">
    <!-- Content goes here -->
</main>

<div id="modal-container"></div>

<!-- Message shown when an HTMX request is rejected by RateLimitFilter (HTTP 429), e.g. too many phone numbers
     revealed. Without it the button would simply do nothing. Above the listing window (z-[100]) and the dialogs (z-[110]). -->
<div id="rate-limit-toast" role="alert"
     class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[120] w-[calc(100%-2rem)] max-w-md bg-textMain text-white text-sm font-medium px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 fade-in">
    <i class="ph-fill ph-hourglass-medium text-2xl text-primary flex-shrink-0"></i>
    <span>[[#{error.tooManyRequests.text}]]</span>
</div>

<footer class="bg-surface border-t border-accent mt-auto py-10 relative z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center">
        <div class="flex items-center mb-4 md:mb-0">
            <div class="w-10 h-10 bg-accent rounded-full flex items-center justify-center mr-3">
                <i class="ph-fill ph-paw-print text-2xl text-primary"></i>
            </div>
            <span class="font-black text-2xl text-textMain tracking-tight">Łapka</span>
        </div>
        <div class="text-textMain/60 font-medium text-sm flex items-center">
            [[#{layout.footer.madeWith}]] <i class="ph-fill ph-heart text-red-400 mx-1"></i> [[#{layout.footer.forAnimals}]]
        </div>
    </div>
</footer>

<script>
        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
            document.body.style.overflow = 'auto';
        }
        // A background HTMX request (chat refresh, message badge) can end on the login page - e.g. the session
        // expired or the account's email changed. Instead of pasting the login page into a small piece
        // of the current page, we go to the login page normally.
        document.body.addEventListener('htmx:beforeSwap', function(evt) {
            const finalUrl = evt.detail.xhr.responseURL || '';
            if (new URL(finalUrl, window.location.href).pathname === '/login') {
                evt.detail.shouldSwap = false;
                window.location.href = finalUrl;
            }
        });
        // HTMX does not swap error responses (4xx/5xx) into the page, so a request rejected by the request limits
        // would end silently. For 429 we show the message for a few seconds instead.
        let rateLimitToastTimer;
        document.body.addEventListener('htmx:responseError', function(evt) {
            if (evt.detail.xhr.status !== 429) {
                return;
            }
            const toast = document.getElementById('rate-limit-toast');
            toast.classList.remove('hidden');
            clearTimeout(rateLimitToastTimer);
            rateLimitToastTimer = setTimeout(() => toast.classList.add('hidden'), 6000);
        });
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if(evt.detail.target.id === 'modal-container' && evt.detail.target.innerHTML.trim() !== '') {
                document.body.style.overflow = 'hidden';
            }
        });
</script>
</body>
</html>
