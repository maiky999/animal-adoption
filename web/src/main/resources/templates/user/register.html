<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::main})}">
<body>
<main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-orange-50/50">
  <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-sm border border-gray-100">

    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-900">[[#{register.title}]]</h2>
      <p class="text-sm text-gray-500 mt-2">[[#{register.subtitle}]]</p>
    </div>

    <!-- The form sends the request to AuthController -->
    <form th:action="@{/register}" th:object="${userRegistrationDto}" method="post" class="space-y-4">

      <!-- NEW FIELD: Account type selection -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">[[#{register.accountType}]]</label>
        <div class="grid grid-cols-2 gap-4">
          <!-- Option: Private person -->
          <label class="relative cursor-pointer">
            <input type="radio" th:field="*{userType}" value="PRIVATE" class="peer sr-only" required>
            <div class="p-4 rounded-xl border-2 border-gray-200 text-center peer-checked:border-primary peer-checked:bg-orange-50 peer-hover:border-gray-300 transition-all">
              <i class="ph-fill ph-user text-2xl text-gray-400 peer-checked:text-primary mb-1"></i>
              <div class="font-bold text-sm text-gray-700">[[#{userType.PRIVATE}]]</div>
            </div>
            <!-- Selection indicator -->
            <div class="absolute top-2 right-2 hidden peer-checked:block text-primary">
              <i class="ph-fill ph-check-circle"></i>
            </div>
          </label>

          <!-- Option: Organization -->
          <label class="relative cursor-pointer">
            <input type="radio" th:field="*{userType}" value="ORGANIZATION" class="peer sr-only" required>
            <div class="p-4 rounded-xl border-2 border-gray-200 text-center peer-checked:border-primary peer-checked:bg-orange-50 peer-hover:border-gray-300 transition-all">
              <i class="ph-fill ph-buildings text-2xl text-gray-400 peer-checked:text-primary mb-1"></i>
              <div class="font-bold text-sm text-gray-700">[[#{userType.ORGANIZATION}]]</div>
            </div>
            <!-- Selection indicator -->
            <div class="absolute top-2 right-2 hidden peer-checked:block text-primary">
              <i class="ph-fill ph-check-circle"></i>
            </div>
          </label>
        </div>
        <p th:if="${#fields.hasErrors('userType')}" th:errors="*{userType}" class="text-red-500 text-xs mt-1"></p>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">[[#{register.email}]]</label>
        <input type="email" id="email" th:field="*{email}" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary outline-none transition">
        <!-- Displaying the validation error (if AuthController catches it from BindingResult) -->
        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-500 text-xs mt-1"></p>
      </div>

      <div>
        <label for="displayName" class="block text-sm font-medium text-gray-700 mb-1">[[#{register.displayName}]]</label>
        <input type="text" id="displayName" th:field="*{displayName}" required th:placeholder="#{register.displayName.placeholder}"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary outline-none transition">
        <p th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}" class="text-red-500 text-xs mt-1"></p>
      </div>

      <div>
        <label for="mobile" class="block text-sm font-medium text-gray-700 mb-1">[[#{register.mobile}]]</label>
        <input type="text" id="mobile" th:field="*{mobile}" required pattern="\d{9}" th:title="#{common.mobile.hint}"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary outline-none transition">
        <p th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}" class="text-red-500 text-xs mt-1"></p>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">[[#{register.password}]]</label>
        <input type="password" id="password" th:field="*{password}" required minlength="8"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary outline-none transition">
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-500 text-xs mt-1"></p>
      </div>

      <div class="pt-4">
        <button type="submit" class="w-full flex justify-center py-3 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-gray-800 hover:bg-gray-900 transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900">
          [[#{register.submit}]]
        </button>
      </div>
    </form>

    <div class="mt-6 text-center text-sm">
      <span class="text-gray-500">[[#{register.haveAccount}]]</span>
      <a th:href="@{/login}" class="font-medium text-primary hover:text-primaryHover">[[#{register.loginLink}]]</a>
    </div>
  </div>
</main>
</body>
</html>
