<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::main})}">
<body>
<main class="max-w-md mx-auto px-4 py-16 w-full flex-grow">

  <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
    <div class="text-center mb-8">
      <i class="ph-fill ph-paw-print text-4xl text-primary mb-2"></i>
      <h2 class="text-3xl font-bold text-gray-800">[[#{login.title}]]</h2>
      <p class="text-gray-500 mt-2">[[#{login.subtitle}]]</p>
    </div>

    <!-- Komunikaty sukcesu z atrybutów Flash (np. po pomyślnej weryfikacji linkiem) -->
    <div th:if="${successMessage}" class="bg-green-50 text-green-700 p-4 rounded-xl text-sm mb-6 border border-green-200 flex items-center shadow-sm fade-in">
      <i class="ph-fill ph-check-circle text-2xl mr-2"></i>
      <span th:text="#{${successMessage}}"></span>
    </div>

    <!-- Komunikat po udanej rejestracji (nasłuchuje na parametr ?success w URL) -->
    <div th:if="${param.success}" class="bg-green-50 text-green-700 p-4 rounded-xl text-sm mb-6 border border-green-200 flex items-start shadow-sm fade-in">
      <i class="ph-fill ph-envelope-open text-2xl mr-3 mt-0.5"></i>
      <div>
        <strong>[[#{login.registered.title}]]</strong><br>
        <span>[[#{login.registered.text}]]</span>
      </div>
    </div>

    <!-- Komunikaty błędu (np. wygasły/zużyty link weryfikacyjny) -->
    <div th:if="${errorMessage}" class="bg-red-50 text-red-600 p-4 rounded-xl text-sm mb-6 border border-red-100 flex items-center shadow-sm fade-in">
      <i class="ph-fill ph-x-circle text-2xl mr-2"></i>
      <span th:text="#{${errorMessage}}"></span>
    </div>

    <!-- Standardowy błąd logowania (Złe hasło / Brak użytkownika) -->
    <div th:if="${param.error} and (${session['SPRING_SECURITY_LAST_EXCEPTION']} == null or !${#strings.contains(session['SPRING_SECURITY_LAST_EXCEPTION'].toString(), 'DisabledException')})"
         class="bg-red-50 text-red-600 p-4 rounded-xl text-sm mb-6 border border-red-100 flex items-center shadow-sm fade-in">
      <i class="ph ph-warning-circle text-2xl mr-2"></i>
      <span>[[#{login.error.badCredentials}]]</span>
    </div>

    <!-- Specjalny błąd dla konta niezweryfikowanego -->
    <div th:if="${param.error} and ${session['SPRING_SECURITY_LAST_EXCEPTION']} != null and ${#strings.contains(session['SPRING_SECURITY_LAST_EXCEPTION'].toString(), 'DisabledException')}"
         class="bg-amber-50 text-amber-700 p-4 rounded-xl text-sm mb-6 border border-amber-200 flex items-start shadow-sm fade-in">
      <i class="ph-fill ph-warning text-2xl mr-2 mt-0.5"></i>
      <div>
        <strong>[[#{login.error.disabled.title}]]</strong><br>
        <span>[[#{login.error.disabled.text}]]</span>
      </div>
    </div>

    <form th:action="@{/login}" method="post" class="space-y-5">

      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">[[#{login.email}]]</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
            <i class="ph ph-envelope-simple text-lg"></i>
          </div>
          <input type="email" id="username" name="username" required th:placeholder="#{login.email.placeholder}"
                 class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition bg-gray-50 focus:bg-white">
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">[[#{login.password}]]</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
            <i class="ph ph-lock-key text-lg"></i>
          </div>
          <input type="password" id="password" name="password" required placeholder="••••••••"
                 class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition bg-gray-50 focus:bg-white">
        </div>
      </div>

      <!-- NOWOŚĆ: Checkbox Zapamiętaj mnie + Link Zapomniałeś hasła -->
      <div class="flex items-center justify-between pt-1 pb-1">
        <label for="remember-me" class="flex items-center cursor-pointer group">
          <!-- name="remember-me" to klucz do działania ze Spring Security! -->
          <input type="checkbox" id="remember-me" name="remember-me"
                 class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary focus:ring-2 cursor-pointer transition">
          <span class="ml-2 text-sm text-gray-600 group-hover:text-gray-800 transition">[[#{login.rememberMe}]]</span>
        </label>

        <a href="#" class="text-primary hover:text-primaryHover font-bold text-sm transition">[[#{login.forgotPassword}]]</a>
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center">
          [[#{login.submit}]] <i class="ph ph-sign-in ml-2 text-xl"></i>
        </button>
      </div>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
      [[#{login.noAccount}]]
      <a th:href="@{/register}" class="text-primary hover:text-primaryHover font-bold transition">[[#{login.registerLink}]]</a>
    </div>

  </div>
</main>
</body>
</html>
