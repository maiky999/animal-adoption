<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::main})}">
<body>
<main class="max-w-md mx-auto px-4 py-16 w-full flex-grow">

  <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
    <div class="text-center mb-8">
      <i class="ph-fill ph-key text-4xl text-primary mb-2"></i>
      <h2 class="text-3xl font-bold text-gray-800">[[#{passwordReset.forgot.title}]]</h2>
      <p class="text-gray-500 mt-2">[[#{passwordReset.forgot.subtitle}]]</p>
    </div>

    <form th:action="@{/forgot-password}" method="post" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">[[#{login.email}]]</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
            <i class="ph ph-envelope-simple text-lg"></i>
          </div>
          <input type="email" id="email" name="email" required autofocus th:placeholder="#{login.email.placeholder}"
                 class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition bg-gray-50 focus:bg-white">
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center">
          [[#{passwordReset.forgot.submit}]] <i class="ph ph-paper-plane-right ml-2 text-xl"></i>
        </button>
      </div>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
      <a th:href="@{/login}" class="text-primary hover:text-primaryHover font-bold transition">
        <i class="ph ph-arrow-left"></i> [[#{passwordReset.backToLogin}]]
      </a>
    </div>
  </div>
</main>
</body>
</html>
