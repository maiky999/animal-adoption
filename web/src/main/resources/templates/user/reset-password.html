<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::main})}">
<body>
<main class="max-w-md mx-auto px-4 py-16 w-full flex-grow">

  <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
    <div class="text-center mb-8">
      <i class="ph-fill ph-lock-key-open text-4xl text-primary mb-2"></i>
      <h2 class="text-3xl font-bold text-gray-800">[[#{passwordReset.reset.title}]]</h2>
      <p class="text-gray-500 mt-2">[[#{passwordReset.reset.subtitle}]]</p>
    </div>

    <form th:action="@{/reset-password}" th:object="${passwordResetDto}" method="post" class="space-y-5">
      <!-- The token from the link goes back to the server with the new password -->
      <input type="hidden" th:field="*{token}">

      <div>
        <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">[[#{passwordReset.reset.newPassword}]]</label>
        <input type="password" id="newPassword" th:field="*{newPassword}" required minlength="8" autocomplete="new-password" autofocus
               class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary focus:border-primary outline-none transition bg-gray-50 focus:bg-white"
               th:classappend="${#fields.hasErrors('newPassword')} ? 'border-red-500' : 'border-gray-300'">
        <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="mt-1 text-sm text-red-500"></p>
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">[[#{passwordReset.reset.confirmPassword}]]</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required autocomplete="new-password"
               class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary focus:border-primary outline-none transition bg-gray-50 focus:bg-white"
               th:classappend="${#fields.hasErrors('passwordConfirmed')} ? 'border-red-500' : 'border-gray-300'">
        <p th:if="${#fields.hasErrors('passwordConfirmed')}" th:errors="*{passwordConfirmed}" class="mt-1 text-sm text-red-500"></p>
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center">
          [[#{passwordReset.reset.submit}]] <i class="ph ph-check ml-2 text-xl"></i>
        </button>
      </div>
    </form>
  </div>
</main>
</body>
</html>
