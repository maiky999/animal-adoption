spring.datasource.url=jdbc:h2:mem:animal_adoption_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# Tests must never connect to a real RabbitMQ broker (e.g. the one from docker-compose running on the developer's
# machine at localhost:5672). auto-startup=false above is not enough: Spring Framework 7 pauses a cached test context
# when no test class uses it and restarts it when the next class with the same configuration needs it. On restart
# RabbitListenerEndpointRegistry starts ALL listener containers, ignoring auto-startup. The containers then log in to
# the local broker with wrong credentials, get ACCESS_REFUSED (a fatal error) and the test fails.
# Nothing listens on port 1, so a listener that gets started this way only logs "Connection refused" and retries
# in the background - it does not affect the tests (they do not send real messages; RabbitTemplate is mocked where needed).
spring.rabbitmq.host=localhost
spring.rabbitmq.port=1

app.security.remember-me-key=testowyKluczRememberMe1234567890!
REMEMBER_ME_KEY=testowyKluczRememberMe1234567890!

app.security.crypto-key=TestKey1234567890
CRYPTO_KEY=TestKey1234567890

spring.sql.init.mode=never