spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=animaladoption;encrypt=false
    username: sa
    password: Your_Strong_Password123!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

server:
  port: 8080
  tomcat:
    max-http-request-size: 50MB
