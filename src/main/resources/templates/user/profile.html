<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::main})}">
<body>
<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full flex-grow">

    <div class="mb-8 border-b border-gray-200 pb-5">
        <h2 class="text-3xl font-bold text-gray-800">Ustawienia profilu</h2>
        <p class="text-gray-500 mt-2">Zarządzaj swoimi danymi kontaktowymi oraz bezpieczeństwem konta.</p>
    </div>

    <!-- Globalny komunikat sukcesu -->
    <div th:if="${successMessage}" class="bg-green-50 text-green-700 p-4 rounded-xl text-sm mb-6 border border-green-200 flex items-center shadow-sm fade-in">
        <i class="ph-fill ph-check-circle text-2xl mr-3"></i>
        <span class="font-medium" th:text="${successMessage}"></span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

        <!-- KARTA 1: DANE PODSTAWOWE -->
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
            <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
                <i class="ph-fill ph-user-circle text-primary text-2xl mr-2"></i> Dane kontaktowe
            </h3>

            <!-- Komunikat błędu (np. zajęty email) -->
            <div th:if="${errorMessage}" class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-100">
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/profile/info}" th:object="${profileDto}" method="post" class="space-y-4 flex-grow flex flex-col">
                <div>
                    <label for="displayName" class="block text-sm font-medium text-gray-700 mb-1">Nazwa wyświetlana</label>
                    <input type="text" id="displayName" th:field="*{displayName}"
                           class="w-full px-4 py-2 border rounded-lg focus:ring-primary focus:border-primary outline-none transition"
                           th:classappend="${#fields.hasErrors('displayName')} ? 'border-red-500' : 'border-gray-300'">
                    <p th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}" class="text-red-500 text-xs mt-1"></p>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Adres email (Login)</label>
                    <input type="email" id="email" th:field="*{email}"
                           class="w-full px-4 py-2 border rounded-lg focus:ring-primary focus:border-primary outline-none transition"
                           th:classappend="${#fields.hasErrors('email')} ? 'border-red-500' : 'border-gray-300'">
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-500 text-xs mt-1"></p>
                </div>

                <div>
                    <label for="mobile" class="block text-sm font-medium text-gray-700 mb-1">Telefon kontaktowy (9 cyfr)</label>
                    <input type="text" id="mobile" th:field="*{mobile}" pattern="\d{9}" title="Wpisz dokładnie 9 cyfr"
                           class="w-full px-4 py-2 border rounded-lg focus:ring-primary focus:border-primary outline-none transition"
                           th:classappend="${#fields.hasErrors('mobile')} ? 'border-red-500' : 'border-gray-300'">
                    <p th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}" class="text-red-500 text-xs mt-1"></p>
                </div>

                <div class="pt-4 mt-auto">
                    <button type="submit" class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-3 px-4 rounded-xl shadow-sm transition">
                        Zapisz dane
                    </button>
                </div>
            </form>
        </div>

        <!-- KARTA 2: ZMIANA HASŁA -->
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
            <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
                <i class="ph-fill ph-lock-key text-gray-600 text-2xl mr-2"></i> Zmiana hasła
            </h3>

            <!-- Komunikat błędu logiki hasła -->
            <div th:if="${errorPasswordMessage}" class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-100">
                <span th:text="${errorPasswordMessage}"></span>
            </div>

            <form th:action="@{/profile/password}" th:object="${passwordDto}" method="post" class="space-y-4 flex-grow flex flex-col">
                <div>
                    <label for="currentPassword" class="block text-sm font-medium text-gray-700 mb-1">Obecne hasło</label>
                    <input type="password" id="currentPassword" th:field="*{currentPassword}"
                           class="w-full px-4 py-2 border rounded-lg focus:ring-gray-400 focus:border-gray-400 outline-none transition"
                           th:classappend="${#fields.hasErrors('currentPassword')} ? 'border-red-500' : 'border-gray-300'">
                    <p th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="text-red-500 text-xs mt-1"></p>
                </div>

                <div>
                    <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">Nowe hasło (min. 8 znaków)</label>
                    <input type="password" id="newPassword" th:field="*{newPassword}"
                           class="w-full px-4 py-2 border rounded-lg focus:ring-gray-400 focus:border-gray-400 outline-none transition"
                           th:classappend="${#fields.hasErrors('newPassword')} ? 'border-red-500' : 'border-gray-300'">
                    <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="text-red-500 text-xs mt-1"></p>
                </div>

                <div class="pt-4 mt-auto">
                    <button type="submit" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition">
                        Zmień hasło
                    </button>
                </div>
            </form>
        </div>

    </div>
</main>
</body>
</html>
