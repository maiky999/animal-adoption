<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::main})}">
<body>
<main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-orange-50/50">
  <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-sm border border-gray-100">

    <div class="text-center mb-8">
      <i class="ph-fill ph-paw-print text-4xl text-primary inline-block mb-2"></i>
      <h2 class="text-3xl font-bold text-gray-900">Zaloguj się</h2>
      <p class="text-sm text-gray-500 mt-2">Witaj ponownie w Łapce!</p>
    </div>

    <!-- KOMUNIKATY SYSTEMOWE -->

    <!-- 1. Błąd logowania (Spring Security dodaje ?error) -->
    <div th:if="${param.error}" class="bg-red-50 text-red-600 p-4 rounded-xl text-sm mb-6 border border-red-100 flex items-center">
      <i class="ph ph-warning-circle text-xl mr-2"></i>
      Nieprawidłowy adres email lub hasło.
    </div>

    <!-- 2. Wylogowanie (Spring Security dodaje ?logout) -->
    <div th:if="${param.logout}" class="bg-blue-50 text-blue-600 p-4 rounded-xl text-sm mb-6 border border-blue-100 flex items-center">
      <i class="ph ph-info text-xl mr-2"></i>
      Wylogowano pomyślnie.
    </div>

    <!-- 3. NOWOŚĆ: Udana rejestracja (AuthController dodaje ?success) -->
    <div th:if="${param.success}" class="bg-green-50 text-green-700 p-4 rounded-xl text-sm mb-6 border border-green-200 flex items-center shadow-sm">
      <i class="ph ph-check-circle text-2xl mr-2"></i>
      Konto zostało pomyślnie utworzone! Możesz się teraz zalogować.
    </div>

    <!-- FORMULARZ LOGOWANIA -->
    <form th:action="@{/login}" method="post" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Adres email</label>
        <input type="email" id="username" name="username" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary outline-none transition">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Hasło</label>
        <input type="password" id="password" name="password" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary outline-none transition">
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full flex justify-center py-3 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-primary hover:bg-primaryHover transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
          Zaloguj się
        </button>
      </div>
    </form>

    <div class="mt-6 text-center text-sm">
      <span class="text-gray-500">Nie masz konta?</span>
      <a th:href="@{/register}" class="font-medium text-primary hover:text-primaryHover transition">Zarejestruj się</a>
    </div>
  </div>
</main>
</body>
</html>
