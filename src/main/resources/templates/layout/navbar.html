<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="bg-surface shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <!-- Logo -->
            <a th:href="@{/}" class="flex items-center cursor-pointer">
                <i class="ph-fill ph-paw-print text-3xl text-primary mr-2"></i>
                <span class="font-bold text-2xl tracking-tight text-textMain"><span class="text-primary">Łapka</span></span>
            </a>

            <!-- Opcje uwierzytelniania / Menu -->
            <div class="flex items-center space-x-4">

                <a th:href="@{/ads}" class="text-gray-600 hover:text-primary transition font-medium mr-4">
                    Przeglądaj ogłoszenia
                </a>

                <!-- NOWOŚĆ: Link widoczny tylko dla Moderatora/Admina -->
                <a sec:authorize="hasAnyRole('MODERATOR', 'ADMIN')" th:href="@{/moderation/ads}" class="text-red-600 hover:text-red-700 transition font-bold mr-4 flex items-center">
                    <i class="ph-fill ph-shield-check mr-1 text-xl"></i> Moderacja
                </a>

                <!-- Dla niezalogowanych -->
                <div sec:authorize="!isAuthenticated()" class="flex items-center space-x-4">
                    <a th:href="@{/login}" class="text-gray-600 hover:text-primary transition font-medium">Zaloguj się</a>
                    <a th:href="@{/register}" class="bg-gray-100 hover:bg-gray-200 text-gray-800 px-5 py-2 rounded-full font-medium transition">Rejestracja</a>
                </div>

                <!-- Dla zalogowanych -->
                <div sec:authorize="isAuthenticated()" class="flex items-center space-x-4">
                    <span class="text-sm text-gray-500 hidden lg:block">
                        Witaj, <strong sec:authentication="name" class="text-gray-700"></strong>!
                    </span>

                    <a th:href="@{/my-ads}" class="text-gray-600 hover:text-primary transition font-medium ml-2 mr-2 flex items-center" title="Moje ogłoszenia">
                        <i class="ph ph-list-dashes text-2xl"></i>
                    </a>

                    <a th:href="@{/ads/new}" class="bg-primary hover:bg-primaryHover text-white px-5 py-2 rounded-full font-medium transition shadow-sm flex items-center">
                        <i class="ph ph-plus-circle mr-2 text-lg"></i> Dodaj
                    </a>

                    <a th:href="@{/messages}" class="text-gray-600 hover:text-primary transition ml-2 flex items-center relative" title="Wiadomości"
                       th:with="unreadCount=${messageService.getUnreadMessagesCount(#authentication.name)}">

                        <i class="ph ph-envelope-simple text-2xl"></i>

                        <span th:if="${unreadCount > 0}" class="absolute top-0 right-0 -mt-1 -mr-1 flex h-4 w-4">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-4 w-4 bg-red-500 text-[9px] font-bold text-white items-center justify-center border-2 border-surface"
                                  th:text="${unreadCount > 99 ? '99+' : unreadCount}">1</span>
                        </span>
                    </a>

                    <a th:href="@{/profile}" class="text-gray-600 hover:text-primary transition ml-2 flex items-center" title="Ustawienia konta">
                        <i class="ph ph-gear text-2xl"></i>
                    </a>

                    <form th:action="@{/logout}" method="post" class="m-0 flex items-center">
                        <button type="submit" class="text-gray-600 hover:text-red-500 transition ml-2 flex items-center" title="Wyloguj">
                            <i class="ph ph-sign-out text-2xl"></i>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</nav>
</body>
</html>
