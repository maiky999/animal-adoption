# {0} - verification link
email.registration.subject=Confirm your Łapka registration 🐾
email.registration.body=Hi!\n\n\
We are glad to hear that you want to join Łapka!\n\
To complete your registration and activate your account, click the confirmation link:\n\n\
{0}\n\n\
You can activate your account within the next 24 hours. After that the link will expire.\n\n\
Best regards,\n\
The Łapka Team!

# {0} - verification link
email.emailChange.subject=Confirm your new Łapka email address 🐾
email.emailChange.body=Hi!\n\n\
We received a request to change the email address of your Łapka account to this address.\n\
To confirm the change, click the link:\n\n\
{0}\n\n\
The link is valid for 24 hours. Until then you log in with your current address.\n\
If you did not request this change, simply ignore this message.\n\n\
Best regards,\n\
The Łapka Team!

