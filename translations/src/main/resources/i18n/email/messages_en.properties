# {0} - link for setting a new password
email.passwordReset.subject=Set a new password in Łapka 🐾
email.passwordReset.body=Hi!\n\n\
We received a request to set a new password for your Łapka account.\n\
To do it, click the link:\n\n\
{0}\n\n\
The link is valid for one hour and can be used only once.\n\
If you did not ask to change your password, ignore this message - your current password still works.\n\n\
Best regards,\n\
The Łapka team!

